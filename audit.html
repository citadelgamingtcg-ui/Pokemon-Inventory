<script>
(function(){
  var CODE = 'diamond-hands';
  // sessionStorage alone means re-typing the passcode every time the phone
  // reclaims the tab. Remembering on a trusted device makes the home-screen
  // icon usable at a show.
  if (sessionStorage.getItem('pcAdminOK') === '1') return;
  if (localStorage.getItem('pcAdminTrusted') === '1') { sessionStorage.setItem('pcAdminOK','1'); return; }
  var e = prompt('Paragon Collectibles — admin passcode:');
  if (e === CODE) {
    sessionStorage.setItem('pcAdminOK','1');
    if (confirm('Remember this device? Skips the passcode next time.\n\nOnly do this on your own phone or laptop.')) {
      localStorage.setItem('pcAdminTrusted','1');
    }
    return;
  }
  location.replace('https://paragoncollectiblesco.com');
})();
</script>

<title>PokéInventory — Inventory Audit</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#D4AF6A;--ink:#0D0D0F;--green:#2e7d32;--green-l:#e8f5e9;--red:#c62828;
        --red-l:#ffebee;--blue:#1A6BB5;--blue-l:#e8f1fb;--amber:#8a6d1f;--amber-l:#fdf6e3;
        --g50:#fafaf9;--g100:#f5f5f4;--g200:#e7e5e4;--g400:#a8a29e;--g600:#57534e;--g900:#1c1917}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       color:var(--g900);background:var(--g100)}
  header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;
         gap:14px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;font-weight:600;flex:1}
  header a{color:var(--gold);text-decoration:none;font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:16px;margin-bottom:14px}
  .btn{padding:10px 16px;border-radius:8px;border:1px solid var(--g200);background:#fff;
       font:inherit;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--g50)} .btn:disabled{opacity:.45;cursor:default}
  .btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.g{background:var(--green);color:#fff;border-color:var(--green)}

  .btn.sm{padding:6px 11px;font-size:13px}

  .row{display:flex;gap:10px;align-items:center}

  input,select{padding:9px 11px;border:1px solid var(--g200);border-radius:8px;font:inherit;font-size:15px}
  label{font-size:11px;color:var(--g600);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px}
  .ok{background:var(--green-l);color:var(--green)} .no{background:var(--red-l);color:var(--red)}
  .w{background:var(--amber-l);color:var(--amber)} .b{background:var(--blue-l);color:var(--blue)}
  .muted{color:var(--g600);font-size:13px}
  .prog{height:10px;background:var(--g200);border-radius:99px;overflow:hidden}

  .focus{display:grid;grid-template-columns:190px 1fr;gap:20px}

  .big{font-size:26px;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:14px}

         color:#fff;padding:11px 18px;border-radius:9px;font-size:14px;z-index:300;opacity:0;

  kbd{background:var(--g100);border:1px solid var(--g200);border-radius:4px;padding:1px 6px;font-size:12px}

               font-size:11px; font-weight:600; background:rgba(212,175,106,.18);
               color:var(--gold); border:1px solid rgba(212,175,106,.35); vertical-align:middle; }

     onclick="if(event.target===this) closeTagPreview()">
  <div style="background:#fff;border-radius:14px;padding:18px;max-width:min(680px,92vw);text-align:center">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_8Q1x-2-WVYa5kGDT0Fj_VyuVjbS2UuU",
  authDomain: "pokeinventory-3ee20.firebaseapp.com",
  projectId: "pokeinventory-3ee20",
  storageBucket: "pokeinventory-3ee20.firebasestorage.app",
  messagingSenderId: "248123177716",
  appId: "1:248123177716:web:6cdad358f21fcc99b7bca1"
};
const db = getFirestore(initializeApp(firebaseConfig));

const KEY = 'pcAudit';
const TAG_PROFILE = 'mini';   // stock currently loaded in the printer
let cards   = [];
let audit   = null;     // { id, startedAt, done:Set, idx }
let staged  = [];       // binder cards not yet in inventory
let dbReady = false;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const m$  = c => (c < 0 ? '-$' : '$') + (Math.abs(c)/100).toFixed(2);
let toastT;
function toast(msg){ const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('on'),2200); }

/* live inventory only — sold, traded and archived cards aren't audited */
const live = () => cards.filter(c => !c.soldPrice && !c.exitType && !c.archived);

function save(){
  if (!audit) { localStorage.removeItem(KEY); return; }
  try {
    localStorage.setItem(KEY, JSON.stringify({
      id: audit.id, startedAt: audit.startedAt, done: [...audit.done], idx: audit.idx, staged
    }));
  } catch(e){}
}
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o) return null;
    staged = o.staged || [];
    return { id:o.id, startedAt:o.startedAt, done:new Set(o.done||[]), idx:o.idx||0 };
  }catch(e){ return null; }
}
audit = load();

onSnapshot(collection(db,'vendor'), snap => {
  cards = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  render();
});

/* ── price lookup ── */
async function ensureDb(){
  if (dbReady || !window.PriceDB) return;
  try { if (!PriceDB.isReady()) await PriceDB.load(); dbReady = true; } catch(e){}
}
function marketFor(card){
  if (!dbReady || !window.PriceDB) return null;
  const hit = PriceDB.lookup(card.name, card.number, card.set, card.condition || 'NM');
  return hit && hit.market_price != null ? hit.market_price : null;
}

/* ── session ── */
/* ── UNTAGGED REVIEW ──
 * Cards without a tag are usually the ones that left the case for a binder.
 * Two honest endings: archive them, or roll them into a bulk item at a single
 * price — because "moved to the $5 binder" isn't the same as "gone".
 */
let untaggedSel = new Set();

window.reviewUntagged = () => {
  const list = live().filter(c => !c.tagId);
  untaggedSel = new Set(list.map(c => c.id));
  renderUntagged();
  document.getElementById('untagged-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.toggleUntagged = id => {
  if (untaggedSel.has(id)) untaggedSel.delete(id); else untaggedSel.add(id);
  renderUntagged();
};
window.untaggedAll = on => {
  const list = live().filter(c => !c.tagId);
  untaggedSel = on ? new Set(list.map(c => c.id)) : new Set();
  renderUntagged();
};
window.closeUntagged = () => { document.getElementById('untagged-panel').style.display = 'none'; };

function renderUntagged() {
  const list = live().filter(c => !c.tagId);
  const el = document.getElementById('untagged-panel');
  el.style.display = 'block';
  const picked = list.filter(c => untaggedSel.has(c.id));
  const value = picked.reduce((n, c) => n + (c.askingPrice || c.tcgPrice || 0) * (c.qty || 1), 0);
  const count = picked.reduce((n, c) => n + (parseInt(c.qty, 10) || 1), 0);

  el.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <strong>${list.length} card(s) without a tag</strong>
      <button class="btn sm" onclick="closeUntagged()">Close</button>
    </div>
    <div class="muted" style="margin-bottom:10px">
      Untick anything you're keeping. ${picked.length} selected · ${count} card(s) · $${value.toFixed(2)} of listed value.
    </div>
    <div class="row wrap" style="margin-bottom:10px">
      <button class="btn sm" onclick="untaggedAll(true)">Select all</button>
      <button class="btn sm" onclick="untaggedAll(false)">Select none</button>
    </div>
    <div style="max-height:340px;overflow:auto;border:1px solid var(--g200);border-radius:8px">
      ${list.map(c => `
        <label style="display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--g100);cursor:pointer">
          <input type="checkbox" ${untaggedSel.has(c.id) ? 'checked' : ''} onchange="toggleUntagged('${c.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600">${esc(c.name || '')}</div>
            <div class="muted">${esc(c.set || '')} ${c.number ? '#' + esc(c.number) : ''} · ${esc(c.condition || 'NM')}${(c.qty||1) > 1 ? ' · ×' + c.qty : ''}</div>
          </div>
          <div style="white-space:nowrap">$${((c.askingPrice || c.tcgPrice || 0)).toFixed(2)}</div>
        </label>`).join('')}
    </div>
    <div class="row wrap" style="margin-top:12px">
      <button class="btn" onclick="archiveUntagged()" ${picked.length ? '' : 'disabled'}>Remove from inventory</button>
      <button class="btn b" onclick="rollUntaggedIntoBulk()" ${picked.length ? '' : 'disabled'}>Roll into a bulk item</button>
    </div>
    <div class="muted" style="margin-top:8px;font-size:12px">
      Removing archives the cards — nothing is deleted, and they stay out of every total.
    </div>
  </div>`;
}

window.archiveUntagged = async () => {
  const picked = live().filter(c => untaggedSel.has(c.id));
  if (!picked.length) return;
  const count = picked.reduce((n, c) => n + (parseInt(c.qty, 10) || 1), 0);
  if (!confirm(`Remove ${picked.length} record(s) — ${count} card(s) — from inventory?\n\nThey're archived, not deleted.`)) return;
  let n = 0;
  for (const c of picked) {
    try {
      await updateDoc(doc(db, 'vendor', c.id), {
        archived: true, archivedAt: Date.now(), archivedReason: 'untagged — moved out of the case'
      });
      n++;
    } catch (e) { toast('Failed on ' + c.name + ': ' + e.message); return; }
  }
  untaggedSel = new Set();
  toast(`Removed ${n} record(s)`);
  renderUntagged(); render();
};

window.rollUntaggedIntoBulk = async () => {
  const picked = live().filter(c => untaggedSel.has(c.id));
  if (!picked.length) return;
  const count = picked.reduce((n, c) => n + (parseInt(c.qty, 10) || 1), 0);
  const priceIn = prompt(`Roll ${count} card(s) into one bulk item.\n\nPrice each ($):`, '5');
  if (priceIn == null) return;
  const price = Math.round(parseFloat(priceIn) || 0);
  if (price <= 0) { toast('Price must be more than zero'); return; }
  const name = prompt('Name for the bulk item:', `$${price} Binder Card`);
  if (name == null) return;

  try {
    const { assigned } = Labels.assignTagIds(cards, [{}]);
    const tagId = assigned[0] ? assigned[0].tagId : null;
    await addDoc(collection(db, 'vendor'), {
      name: name.trim() || `$${price} Binder Card`,
      bulk: true, qty: count, tcgPrice: price, askingPrice: price,
      condition: 'NM', set: 'Bulk', number: '',
      tagId, addedAt: Date.now(), acquiredVia: 'rolled from singles'
    });
    for (const c of picked) {
      await updateDoc(doc(db, 'vendor', c.id), {
        archived: true, archivedAt: Date.now(), archivedReason: 'rolled into bulk item'
      });
    }
    untaggedSel = new Set();
    toast(`${count} card(s) → one bulk item${tagId ? ' · tag ' + tagId : ''}`);
    renderUntagged(); render();
  } catch (e) { toast('Failed: ' + e.message); }
};

window.beginAudit = async () => {
  await ensureDb();
  audit = { id:'aud-'+Date.now(), startedAt:Date.now(), done:new Set(), idx:0 };
  staged = [];
  save(); render();
  toast('Audit started — ' + live().length + ' cards to check');
};
window.abandonAudit = () => {
  if (!confirm('Discard this audit? Prices and tags already saved stay saved.')) return;
  audit = null; staged = []; save(); render();
};

const queue = () => live().slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const pending = () => queue().filter(c => !audit.done.has(c.id));

window.jumpTo = id => {
  const q = queue(); const i = q.findIndex(c => c.id === id);
  if (i >= 0) { audit.idx = i; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
};
window.skipCard = () => { audit.idx = Math.min(audit.idx+1, queue().length-1); save(); render(); };
window.prevCard = () => { audit.idx = Math.max(audit.idx-1, 0); save(); render(); };

window.applyMarket = async () => {
  const c = queue()[audit.idx]; if (!c) return;
  const mkt = marketFor(c);
  if (mkt == null) { toast('No local price for this card'); return; }
  await updateDoc(doc(db,'vendor',c.id), { tcgPrice: mkt, prevPrice: c.tcgPrice || null });
  toast('Market updated to $' + mkt.toFixed(2));
};

/* The stored card has no ladder attached, so pull it from the database on the
 * fly — that is what makes a condition change reprice instead of just relabel. */
function ladderFor(card){
  if (!dbReady || !window.PriceDB) return {};
  const hit = PriceDB.lookup(card.name, card.number, card.set, card.condition || 'NM');
  return (hit && hit.prices_by_condition) || {};
}
function condOptionsFor(card){
  return POS.conditionOptions(ladderFor(card), card.tcgPrice);
}

window.setCondition = async (val) => {
  const c = queue()[audit.idx]; if (!c) return;
  const r = POS.priceAtCondition(ladderFor(c), val, c.tcgPrice);
  await updateDoc(doc(db,'vendor',c.id), {
    condition: val,
    tcgPrice: r.price,
    prevPrice: c.tcgPrice || null,
    askingPrice: Math.round(r.price)
  });
  toast(val + ' → $' + r.price.toFixed(2) + (r.exact ? '' : ' (estimated)'));
};

window.setAsking = async (val) => {
  const c = queue()[audit.idx]; if (!c) return;
  const v = Math.round(parseFloat(val));   // asking prices are whole dollars
  if (isNaN(v) || v < 0) return;
  await updateDoc(doc(db,'vendor',c.id), { askingPrice: v });
};

/* Preview uses the same layout constants as the ZPL, and shows the serial an
 * untagged card would receive without writing it until you actually print. */
let tpCard = null;

window.previewTag = () => {
  const c = queue()[audit.idx]; if (!c) return;
  const tagId = c.tagId || (Labels.assignTagIds(cards, [c]).assigned[0] || {}).tagId;
  tpCard = { ...c, tagId };
  document.getElementById('tp-card').textContent =
    `${c.name || ''} — ${c.set || ''} ${c.number ? '#' + c.number : ''} · ${c.condition || 'NM'}`;
  document.getElementById('tp-overlay').style.display = 'flex';
  drawTagPreview();
};
window.closeTagPreview = () => { document.getElementById('tp-overlay').style.display = 'none'; };

window.drawTagPreview = () => {
  if (!tpCard) return;
  const profile = document.getElementById('tp-profile').value;
  const zoom = profile === 'std' ? 2 : profile === 'small' ? 3 : 4;
  Labels.drawPreview(document.getElementById('tp-canvas'), tpCard, zoom, { profile });
  document.getElementById('tp-note').textContent = tpCard.tagId
    ? (cards.find(x => x.id === tpCard.id) || {}).tagId
      ? 'Tag ' + tpCard.tagId + ' · QR content is generated by the printer'
      : tpCard.tagId + ' will be assigned when you print'
    : '';
  const p = Labels.validate(tpCard, { profile });
  document.getElementById('tp-warn').textContent = p.length ? '⚠︎ ' + p.join(' · ') : '';
};

window.downloadTagZpl = () => {
  if (!tpCard) return;
  const profile = document.getElementById('tp-profile').value;
  Labels.downloadZPL(Labels.buildLabel(tpCard, { profile }), 'tag-' + tpCard.tagId + '.zpl');
};

window.calibratePrinter = async () => {
  if (!confirm('Calibrate the printer for the loaded labels?\n\nIt will feed a few blanks while it measures the gap.')) return;
  try { await Labels.printZPL(Labels.CALIBRATE_ZPL); toast('Calibrating — let it finish feeding'); }
  catch (e) { showPrintError(e.message || String(e)); }
};

window.printAlignment = async () => {
  try {
    await Labels.printZPL(Labels.alignmentZPL(TAG_PROFILE));
    toast('Alignment label sent — all four corner squares should be fully on the label');
  } catch (e) { showPrintError(e.message || String(e)); }
};

window.printCurrentTag = async () => {
  const c = queue()[audit.idx]; if (!c) return;
  try {
    let tagId = c.tagId;
    if (!tagId) {
      const { assigned } = Labels.assignTagIds(cards, [c]);
      tagId = assigned[0].tagId;
      await updateDoc(doc(db,'vendor',c.id), { tagId });
      c.tagId = tagId;
    }
    await Labels.printZPL(Labels.buildLabel({ ...c, tagId }, { profile: TAG_PROFILE }));
    toast('🏷️ Printed ' + tagId);
  } catch (e) {
    // Don't quietly fall back to a file — that turns one bad setting into a
    // hundred manual downloads. Show what the printer actually said.
    lastPrintError = e.message || String(e);
    showPrintError(lastPrintError);
  }
  render();
};

let lastPrintError = null;

function showPrintError(msg) {
  const el = document.getElementById('print-error');
  el.style.display = 'block';
  el.innerHTML = `<strong>Print failed.</strong> <span style="font-family:ui-monospace,monospace;font-size:12px">${esc(msg).slice(0, 400)}</span>
    <div style="margin-top:8px" class="row wrap">
      <button class="btn sm" onclick="printCurrentTag()">Retry</button>
      <button class="btn sm" onclick="runPrintDiag()">Diagnose</button>
      <button class="btn sm" onclick="downloadTagZpl()">Download .zpl instead</button>
      <button class="btn sm" onclick="document.getElementById('print-error').style.display='none'">Dismiss</button>
    </div>
    <pre id="print-diag" style="display:none;margin-top:10px;max-height:240px;overflow:auto;background:var(--ink);color:#e7e5e4;padding:10px;border-radius:6px;font-size:11px"></pre>`;
}

window.runPrintDiag = async () => {
  const pre = document.getElementById('print-diag');
  pre.style.display = 'block';
  pre.textContent = 'checking…';
  const c = queue()[audit.idx];
  const zpl = c ? Labels.buildLabel({ ...c, tagId: c.tagId || 'PC-00000' }, { profile: TAG_PROFILE }) : '^XA^XZ';
  pre.textContent = JSON.stringify(await Labels.diagnose(zpl), null, 2);
};

window.verifyCard = async () => {
  const c = queue()[audit.idx]; if (!c) return;
  if (!c.tagId && !confirm('This card has no tag yet. Verify without printing one?')) return;
  audit.done.add(c.id);
  try {
    await updateDoc(doc(db,'vendor',c.id), {
      auditedAt: Date.now(), auditSession: audit.id, lastSeenAt: Date.now()
    });
  } catch(e){ toast('Save failed: '+e.message); }
  const nextIdx = queue().findIndex((x,i) => i > audit.idx && !audit.done.has(x.id));
  audit.idx = nextIdx >= 0 ? nextIdx : Math.min(audit.idx+1, queue().length-1);
  save(); render();
};
window.unverifyCard = id => { audit.done.delete(id); save(); render(); };

/* ── binder additions ── */
let hits = [], hitFilter = '';

window.stagedSearch = async () => {
  const raw = document.getElementById('add-q').value.trim();
  if (!raw) return;
  const el = document.getElementById('add-results');
  el.innerHTML = '<span class="muted">searching…</span>';
  const jp = document.getElementById('add-jp')?.checked;
  const r = await POS.findCards(raw, { limit: 60, japanese: jp });
  hits = r.cards; hitFilter = '';
  paintHits();
  if (r.query.number && r.total) toast('#' + r.query.number + ' → ' + r.total + ' match(es)');
};

window.filterHits = v => { hitFilter = v; paintHits(); };

function paintHits(){
  const el = document.getElementById('add-results');
  if (!hits.length) { el.innerHTML = '<span class="pill no">nothing found</span>'; return; }
  const sets = POS.setsIn(hits);
  const shown = hitFilter ? hits.filter(c => (c.set_name||'') === hitFilter) : hits;
  const picker = sets.length > 1 ? `<select onchange="filterHits(this.value)" style="margin:6px 0">
      <option value="">All sets (${hits.length})</option>
      ${sets.map(([n,k])=>`<option value="${esc(n)}" ${hitFilter===n?'selected':''}>${esc(n)} (${k})</option>`).join('')}
    </select>` : '';
  el.innerHTML = picker + shown.map(c => {
    const i = hits.indexOf(c);
    return `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--g100)">
      <div class="row" style="gap:10px;min-width:0">
        ${c.image_url
          ? `<img src="${esc(c.image_url)}" loading="lazy" style="width:46px;height:64px;object-fit:contain;border-radius:4px;background:var(--g100)" onerror="this.style.visibility='hidden'">`
          : `<div style="width:46px;height:64px;background:var(--g100);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--g400)">🃏</div>`}
        <div style="min-width:0">
          <strong>${esc(c.name)}</strong>
          <div class="muted">${c._jp?'🇯🇵 ':''}${esc(c.set_name||'')} ${c.number?'#'+esc(c.number):''}</div>
          ${c.printing?`<div class="muted">${esc(c.printing)}</div>`:''}
        </div>
      </div>
      <div class="row" style="white-space:nowrap">
        <span>${c.market_price!=null?'$'+Number(c.market_price).toFixed(2):'—'}</span>
        <button class="btn sm" onclick="stageCard(${i})">Add</button>
      </div></div>`;
  }).join('') + (shown.length < hits.length ? `<div class="muted" style="margin-top:6px">${shown.length} of ${hits.length} shown</div>` : '');
}

window.stageCard = i => {
  const h = hits[i]; if (!h) return;
  const mkt = Number(h.market_price)||0;
  staged.push({ name:h.name, set:h.set_name||'', number:h.number||'', condition:'NM',
                tcgPrice:mkt, askingPrice:mkt, costBasis:0, imageUrl:h.image_url||null, qty:1,
                ladder:h.prices_by_condition||{}, nm:mkt, isJapanese:!!h._jp });
  document.getElementById('add-q').value=''; hits=[]; document.getElementById('add-results').innerHTML='';
  save(); render();
};
window.editStaged = (i,f,v) => {
  const c = staged[i];
  if (f === 'condition') {
    c.condition = v;
    const r = POS.priceAtCondition(c.ladder, v, c.nm);
    c.tcgPrice = r.price;
    c.askingPrice = r.price;
    c.estimated = !r.exact;
  } else {
    c[f] = parseFloat(v) || 0;
  }
  save(); render();
};
window.removeStaged = i => { staged.splice(i,1); save(); render(); };

window.importStaged = async () => {
  if (!staged.length) { toast('Nothing staged'); return; }
  if (!confirm('Add ' + staged.length + ' card(s) to inventory?')) return;
  try {
    const created = [];
    for (const s of staged) {
      const ref = await addDoc(collection(db,'vendor'), {
        ...s, acquiredVia:'existing', acquiredAt:Date.now(), addedAt:Date.now(),
        auditedAt:Date.now(), auditSession:audit.id, lastSeenAt:Date.now()
      });
      created.push(ref.id);
    }
    created.forEach(id => audit.done.add(id));
    staged = []; save(); render();
    toast('Imported ' + created.length + ' card(s)');
  } catch(e){ toast('Import failed: '+e.message); }
};

window.finishAudit = async () => {
  const left = pending().length;
  if (staged.length) { toast('Import the staged cards first'); return; }
  if (left && !confirm(left + ' card(s) were never verified. Finish anyway?\n\nThey stay in inventory — you can archive them from here later.')) return;
  const n = audit.done.size;
  audit = null; save(); render();
  toast('Audit complete — ' + n + ' cards verified');
};

/* ── render ── */
function render(){
  const intro = document.getElementById('intro');
  const foc   = document.getElementById('focus');
  const stg   = document.getElementById('staged');
  const wl    = document.getElementById('worklist');

  if (!audit) {
    const n = live().length;
    const untagged = live().filter(c=>!c.tagId).length;
    foc.innerHTML=''; stg.innerHTML=''; wl.innerHTML='';
    intro.innerHTML = `<div class="card">
      <h2 style="font-size:18px;margin-bottom:8px">Pre-show audit</h2>
      <p class="muted" style="margin-bottom:14px">
        Walk every card in inventory: check the market price, set your asking price,
        print its tag, mark it verified. Add anything that isn't in the system yet as
        you go, then import it all at the end.
      </p>
      <div class="row wrap" style="margin-bottom:16px">
        <div><label>In inventory</label><div class="big">${n}</div></div>
        <div style="margin-left:24px"><label>Without a tag</label>
          <div class="big" style="color:${untagged?'var(--amber)':'var(--green)'}">${untagged}</div></div>
      </div>
      <div class="row wrap">
        <button class="btn p lg" onclick="beginAudit()">Begin audit</button>
        ${untagged ? `<button class="btn lg" onclick="reviewUntagged()">Review ${untagged} without a tag</button>` : ''}
      </div>
    </div>`;
    return;
  }

  const q = queue();
  const total = q.length;
  const done  = q.filter(c=>audit.done.has(c.id)).length;
  const pct   = total ? Math.round((done/total)*100) : 0;
  const c     = q[Math.min(audit.idx, Math.max(0,total-1))];

  intro.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div><strong>${done} / ${total} verified</strong> <span class="muted">· ${pct}%</span></div>
      <div class="row">
        <button class="btn sm" onclick="finishAudit()">Finish audit</button>
        <button class="btn sm" onclick="abandonAudit()">Discard</button>
      </div>
    </div>
    <div class="prog"><div style="width:${pct}%"></div></div>
  </div>`;

  if (!c) { foc.innerHTML = `<div class="card"><span class="pill ok">Everything verified</span></div>`; }
  else {
    const mkt = marketFor(c);
    const cur = c.tcgPrice || 0;
    const drift = mkt != null && cur > 0 ? Math.round(((mkt-cur)/cur)*100) : null;
    const ask = c.askingPrice || c.tcgPrice || 0;
    const isDone = audit.done.has(c.id);
    foc.innerHTML = `<div class="card">
      <div class="focus">
        <div>${c.imageUrl
          ? `<img class="thumb" src="${esc(c.imageUrl)}" alt="">`
          : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:44px">🃏</div>`}
        </div>
        <div>
          <div class="row" style="justify-content:space-between;flex-wrap:wrap">
            <div>
              <div class="huge">${esc(c.name||'')}</div>
              <div class="muted">${esc(c.set||'')} ${c.number?'#'+esc(c.number):''} · ${esc(c.condition||'NM')} · qty ${c.qty||1}</div>
            </div>
            <div style="text-align:right">
              ${c.tagId ? `<span class="pill b">${esc(c.tagId)}</span>` : `<span class="pill w">no tag yet</span>`}
              ${isDone ? `<div style="margin-top:6px"><span class="pill ok">verified</span></div>` : ''}
            </div>
          </div>

          <div class="row wrap" style="margin:16px 0;gap:22px">
            <div>
              <label>Stored market</label>
              <div class="big">$${cur.toFixed(2)}</div>
            </div>
            <div>
              <label>Local database</label>
              <div class="big" style="color:${mkt==null?'var(--g400)':'var(--blue)'}">
                ${mkt==null?'—':'$'+mkt.toFixed(2)}
                ${drift!=null && Math.abs(drift)>=5
                  ? `<span class="pill ${drift>0?'ok':'no'}" style="margin-left:6px">${drift>0?'+':''}${drift}%</span>`:''}
              </div>
            </div>
            <div>
              <label>Condition</label>
              <select onchange="setCondition(this.value)" style="font-size:16px;padding:10px">
                ${condOptionsFor(c).map(o=>`<option value="${o.code}" ${(c.condition||'NM')===o.code?'selected':''}>${o.code} · $${o.price.toFixed(2)}${o.exact?'':'*'}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Asking price</label>
              <input type="number" step="1" value="${Math.round(ask)}" style="width:130px;font-size:20px;font-weight:600"
                     onchange="setAsking(this.value)">
            </div>
          </div>

          <div class="row wrap">
            <button class="btn" onclick="applyMarket()" ${mkt==null?'disabled':''}>↻ Use database price</button>
            <button class="btn" onclick="previewTag()">👁 Preview <kbd>V</kbd></button>
            <button class="btn b" onclick="printCurrentTag()">🏷️ ${c.tagId?'Reprint':'Print'} tag <kbd>P</kbd></button>
            <button class="btn g lg" onclick="verifyCard()">✓ Verified <kbd>Enter</kbd></button>
            <button class="btn" onclick="skipCard()">Skip →</button>
            <button class="btn sm" onclick="prevCard()">← Back</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  const mktTotal  = staged.reduce((s,x)=>s+Math.round((x.tcgPrice||0)*100),0);
  stg.innerHTML = `<div class="card">
    <h3 style="font-size:14px;margin-bottom:10px">Cards not in inventory yet ${staged.length?`<span class="pill b">${staged.length}</span>`:''}</h3>
    <div class="row" style="margin-bottom:10px">
      <input id="add-q" placeholder="charmander 04/208  ·  or  charmander, paldean fates" style="flex:1"
             onkeydown="if(event.key==='Enter'){event.preventDefault();stagedSearch()}">
      <button class="btn" onclick="stagedSearch()">Search</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;text-transform:none;letter-spacing:0;margin:0">
        <input type="checkbox" id="add-jp" style="width:auto" onchange="stagedSearch()"> 🇯🇵 JP
      </label>
    </div>
    <div id="add-results"></div>
    ${staged.length ? `
      <table style="margin-top:12px"><tr><th>Card</th><th>Cond</th><th>Market</th><th>Asking</th><th></th></tr>
      ${staged.map((x,i)=>`<tr>
        <td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.set)} ${x.number?'#'+esc(x.number):''}</div></td>
        <td><select onchange="editStaged(${i},'condition',this.value)">
          ${POS.conditionOptions(x.ladder, x.nm != null ? x.nm : x.tcgPrice)
              .map(o=>`<option value="${o.code}" ${x.condition===o.code?'selected':''}>${o.code} · $${o.price.toFixed(2)}${o.exact?'':'*'}</option>`).join('')}
        </select></td>
        <td><input type="number" step="0.01" value="${x.tcgPrice}" style="width:92px" onchange="editStaged(${i},'tcgPrice',this.value)"></td>
        <td><input type="number" step="0.01" value="${x.askingPrice}" style="width:92px" onchange="editStaged(${i},'askingPrice',this.value)"></td>
        <td><button class="btn sm" onclick="removeStaged(${i})">×</button></td></tr>`).join('')}
      </table>
      <div class="row" style="justify-content:space-between;margin-top:12px">
        <span class="muted">${staged.length} staged · ${m$(mktTotal)} market value</span>
        <button class="btn g" onclick="importStaged()">Import to inventory</button>
      </div>` : '<div class="muted" style="margin-top:8px">Nothing staged.</div>'}
  </div>`;

  const rest = pending();
  wl.innerHTML = `<div class="card">
    <h3 style="font-size:14px;margin-bottom:10px">Remaining ${rest.length?`<span class="pill w">${rest.length}</span>`:'<span class="pill ok">none</span>'}</h3>
    ${rest.length ? `<table><tr><th>Card</th><th>Set</th><th>Market</th><th>Asking</th><th>Tag</th><th></th></tr>
      ${rest.slice(0,150).map(x=>`<tr>
        <td>${esc(x.name||'')}</td>
        <td class="muted">${esc(x.set||'')} ${x.number?'#'+esc(x.number):''}</td>
        <td>$${(x.tcgPrice||0).toFixed(2)}</td>
        <td>$${(x.askingPrice||x.tcgPrice||0).toFixed(2)}</td>
        <td>${x.tagId?`<span class="pill b">${esc(x.tagId)}</span>`:'<span class="pill w">—</span>'}</td>
        <td><button class="btn sm" onclick="jumpTo('${x.id}')">Go</button></td></tr>`).join('')}
      </table>${rest.length>150?`<div class="muted" style="margin-top:8px">…and ${rest.length-150} more</div>`:''}` : ''}
  </div>`;
}

/* keyboard: the whole point is speed */
document.addEventListener('keydown', e => {
  if (!audit) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Enter') { e.preventDefault(); verifyCard(); }
  else if (e.key.toLowerCase() === 'p') { e.preventDefault(); printCurrentTag(); }
  else if (e.key.toLowerCase() === 'v') { e.preventDefault(); previewTag(); }
  else if (e.key === 'Escape') closeTagPreview();
  else if (e.key === 'ArrowRight') skipCard();
  else if (e.key === 'ArrowLeft') prevCard();
});

(async () => {
  await ensureDb();
  render();
  if (window.Labels) {
    const s = await Labels.bpStatus();
    const el = document.getElementById('printer');
    el.className = 'pill ' + (s.ok ? 'ok' : 'no');
    el.textContent = s.ok ? 'printer ready' : 'no printer';
  }
})();
render();
</script>
</body>
</html>
